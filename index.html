<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JEJU - 여행, 그 이상의 제주</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>

    <!-- 1. 헤더 영역 (로고, 메뉴, 검색) -->
    <header class="header-box">
        <div class="logo">
            <h1>JEJU</h1>
            <p>여행, 그 이상의 제주</p>
        </div>
        <nav class="top-nav">
            <ul>
                <li><a href="#">홈</a></li>
                <li><a href="#">여행지</a></li>
                <li><a href="#">맛집</a></li>
                <li><a href="#">여행코스</a></li>
                <li><a href="#">커뮤니티</a></li>
            </ul>
        </nav>
    </header>

    <!-- 레이아웃 컨테이너 -->
    <div class="container">

        <!-- 2. 사이드 메뉴 -->
        <aside class="sidebar-box">
            <ul class="sidebar-menu">
                <li><a href="#">🏠 홈</a></li>
                <li><a href="#">📍 여행지</a></li>
                <li><a href="#">🍴 맛집</a></li>
                <li><a href="#">🗓️ 여행코스</a></li>
                <li><a href="#">📋 여행팁</a></li>
            </ul>
            <div class="side-banner">
                🌴 제주에서 <br> 만나는 행복 ❤️
            </div>
        </aside>

        <!-- 3. 본문 영역 -->
        <main class="content-box">

            <!-- 메인 비주얼 배너 -->
            <section class="hero-banner">
                <!-- 📸 메인 사진 (src에 내 사진 이름을 적어주세요) -->
                <img src="제주도 배경.jpg" alt="제주 메인 풍경">
                <div class="hero-text">
                    <h2>제주도에서<br>만나는 특별한 순간</h2>
                    <a href="#" class="btn-more">자세히 보기 ></a>
                </div>
            </section>

            <!-- 5. 콘텐츠 구성 (추천 여행지 카드 3개) -->
            <section>
                <h2 class="section-title">📍 추천 여행지</h2>
                <div class="card-group">
                    
                    <div class="card">
                        <!-- 📸 1번 사진 -->
                        <img src="성상일출봉.jpg" alt="성산일출봉">
                        <h3>성산일출봉</h3>
                        <p>제주의 대표적인 일출 명소</p>
                        <a href="#" class="btn-card">자세히 보기</a>
                    </div>

                    <div class="card">
                        <!-- 📸 2번 사진 -->
                        <img src="협재해수욕장.jpg" alt="협재해수욕장">
                        <h3>협재해수욕장</h3>
                        <p>맑은 바다와 하얀 모래가 있는 해수욕장</p>
                        <a href="#" class="btn-card">자세히 보기</a>
                    </div>

                    <div class="card">
                        <!-- 📸 3번 사진 -->
                        <img src="올레사진.jpg" alt="올레사진">
                        <h3>올레시장</h3>
                        <p>먹거리와 정이 넘치는 제주 대표 전통시장</p>
                        <a href="#" class="btn-card">자세히 보기</a>
                    </div>

                </div>
            </section>

            <!-- 4. 관심 메뉴 영역 (하단 안내 배너) -->
            <section class="interest-banner">
                <p>🌴 지금, 제주로 떠나보세요!</p>
                <a href="#" class="btn-card">자세히 보기 ></a>
            </section>

        </main>

    </div>

</body>
</html>
