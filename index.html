<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
<title>에시2 - 카드 단위로 div로 나누기</title>
<style>
  *{box-sizing: border-box;}
  body{font-family:sans-serif;background:#eee; margin:0; padding: 30px;}

  .card-list{
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .card{
    background: white;
    width: 220px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }

  .card-image{
    background:#4a90e2;
    color: white;
    alige-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .card-body{
    padding: 15px;
  }

  .card-body h3{margin: 0 0 8px;}
  .card-body p {margin:0; font-size: 14px; color:#555;}
  </style>
  </head>

  <body>
    <h2> 아이돌 소개 카드</h2>
    <!-- 카드 여러 개를 감싸는 큰 div-->
    <div class="card-list">

      <!--카드 1-->
      <div class="card">
        <div class="card-image">사진자리</div>
         <div class="card-body">
           <h3>이름: 윤정한</h3>
           <p>관심 분야: 캐럿</p>
         </div>
      </div>
      
       <!--카드 2-->
      <div class="card">
         <div class="card-image">사진자리</div>
         <h3>이름: 최산</h3>
           <p>관심 분야: 에이티니</p>
         </div>
      </div>
   <!--카드 3-->
    <div class="card">
         <div class="card-image">사진자리</div>
         <h3>이름: 최연준</h3>
           <p>관심 분야: 모아</p>
         </div>
  </div>

  </div>
    
    
  </body>
</html>
